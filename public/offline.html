<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بدون اتصال | بصمة+</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Cairo", "Tajawal", system-ui, sans-serif;
        background: #f8f9fa;
        color: #222;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: #fff;
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 8px 32px -8px rgba(42, 138, 136, 0.18);
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
      }
      p {
        margin-top: 0.75rem;
        color: #666;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.65rem 1.75rem;
        background: linear-gradient(135deg, #2a8a88, #4aaa88);
        color: #fff;
        border: none;
        border-radius: 0.75rem;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>يبدو أنك غير متصل بالإنترنت. تحقّق من اتصالك ثم حاول مجدداً.</p>
      <button onclick="location.reload()">حاول مجدداً</button>
    </div>
  </body>
</html>
